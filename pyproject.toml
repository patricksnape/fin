[project]
name = "fin"
version = "0.1.0"
description = "Python plaintext accounting: importers, analytics, UI and privacy-gated LLM agent"
requires-python = ">=3.12"
dependencies = [
    "beancount>=3.0",
    "beanquery>=0.1",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1"]
browser = ["playwright>=1.45"]
pdf = ["pdfplumber>=0.11"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
fin = "fin.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: encrypted-remote tests (about 3 minutes); skip with -m \"not slow\""]
